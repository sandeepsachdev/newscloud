<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#08090f">
  <title>NewsCloud — World Trending Topics</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg:        #08090f;
      --surface:   #0f1322;
      --surface2:  #161d35;
      --border:    #1e2847;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --c1: #60a5fa; --c2: #4ade80; --c3: #f472b6;
      --c4: #fb923c; --c5: #a78bfa; --c6: #22d3ee;
      --c7: #fbbf24; --c8: #f87171;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ── Header ── */
    #app-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .logo {
      font-size: clamp(1rem, 4vw, 1.4rem);
      font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }
    #status-badge {
      font-size: 0.72rem; padding: 4px 10px; border-radius: 20px;
      background: rgba(96,165,250,.12); color: var(--c1);
      border: 1px solid rgba(96,165,250,.25); white-space: nowrap;
      transition: all .3s;
    }
    #status-badge.live { background: rgba(74,222,128,.12); color: var(--c2); border-color: rgba(74,222,128,.25); }
    #status-badge.error { background: rgba(248,113,113,.12); color: var(--c8); border-color: rgba(248,113,113,.25); }

    /* ── Cloud wrapper ── */
    #cloud-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 12px 8px 4px;
      min-height: calc(100dvh - 110px);
    }
    #cloud-canvas {
      display: block; border-radius: 16px; cursor: pointer;
      transition: opacity .45s ease;
    }
    #cloud-canvas.fading { opacity: 0; }

    /* ── Shape HUD ── */
    #shape-hud {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 8px 0 12px;
    }
    #shape-name {
      font-size: .72rem; color: var(--muted); letter-spacing: .06em;
      text-transform: uppercase;
    }
    #timer-track {
      width: min(200px, 60vw); height: 3px;
      background: var(--border); border-radius: 3px; overflow: hidden;
    }
    #timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--c1), var(--c2));
      border-radius: 3px;
      transform-origin: left;
      animation: timerCountdown 20s linear forwards;
    }
    @keyframes timerCountdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    #shape-dots {
      display: flex; gap: 6px; align-items: center;
    }
    .sdot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--border); transition: background .3s, transform .3s;
      cursor: pointer;
    }
    .sdot.active { background: var(--c1); transform: scale(1.4); }

    #last-refreshed {
      font-size: .68rem; color: var(--muted); letter-spacing: .04em;
      margin-top: 2px;
    }
    #last-refreshed.hidden { visibility: hidden; }

    /* ── Empty / loading state ── */
    #cloud-placeholder {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 40px 20px;
      color: var(--muted); text-align: center;
    }
    .spin-ring {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--c1); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Full-screen loading overlay ── */
    #overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      transition: opacity .5s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay-logo {
      font-size: 2.5rem; font-weight: 800;
      background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
    .overlay-msg { color: var(--muted); font-size: .9rem; }

    /* ── Modal ── */
    .modal-content {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
    }
    .modal-header {
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }
    .modal-title { font-size: 1rem; font-weight: 600; }
    .modal-footer {
      border-top: 1px solid var(--border);
      padding: 12px 20px;
    }
    .modal-body { padding: 16px; max-height: 65vh; overflow-y: auto; }
    .modal-body::-webkit-scrollbar { width: 5px; }
    .modal-body::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    .article-card {
      display: block; text-decoration: none;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 15px; margin-bottom: 10px;
      transition: border-color .2s, transform .15s; color: var(--text);
    }
    .article-card:hover, .article-card:focus {
      border-color: var(--c1); transform: translateY(-1px); color: var(--text);
    }
    .article-card:last-child { margin-bottom: 0; }
    .ac-source {
      font-size: .68rem; font-weight: 600; letter-spacing: .07em;
      text-transform: uppercase; color: var(--c1); margin-bottom: 5px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .ac-date { font-size: .68rem; color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
    .ac-title { font-size: .88rem; font-weight: 500; line-height: 1.45; margin-bottom: 5px; }
    .ac-desc {
      font-size: .78rem; color: var(--muted); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .ac-arrow {
      float: right; color: var(--c1); font-size: .8rem;
      margin-left: 6px; margin-top: 2px;
    }

    .topic-tag {
      display: inline-block; background: rgba(96,165,250,.15);
      color: var(--c1); border: 1px solid rgba(96,165,250,.3);
      border-radius: 6px; padding: 2px 9px; font-size: .78rem; font-weight: 600;
    }
    .article-count-badge {
      font-size: .72rem; color: var(--muted);
    }

    @media (max-width: 576px) {
      #app-header { padding: 8px 12px; }
      .modal-dialog { margin: 8px; }
      .modal-content { border-radius: 14px; }
    }
  </style>
</head>
<body>

<!-- Full-screen overlay -->
<div id="overlay">
  <div class="overlay-logo">⚡ NewsCloud</div>
  <div class="spin-ring"></div>
  <div class="overlay-msg">Gathering world news…</div>
</div>

<!-- Header -->
<header id="app-header">
  <div class="logo">⚡ NewsCloud</div>
  <span id="status-badge">Loading…</span>
</header>

<!-- Main content -->
<main id="cloud-wrap">
  <div id="cloud-placeholder">
    <div class="spin-ring"></div>
    <div>Analysing trending topics…</div>
  </div>
  <canvas id="cloud-canvas" style="display:none"></canvas>
</main>

<!-- Shape HUD -->
<div id="shape-hud">
  <div id="shape-name">Circle</div>
  <div id="timer-track"><div id="timer-fill"></div></div>
  <div id="shape-dots"></div>
  <div id="last-refreshed" class="hidden">Last refreshed: just now</div>
</div>

<!-- Articles modal -->
<div class="modal fade" id="articlesModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modal-title"></div>
          <div class="article-count-badge mt-1" id="modal-count"></div>
        </div>
        <button type="button" class="btn-close btn-close-white ms-3" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer justify-content-start py-2">
        <small class="text-muted">Click any article to open in a new tab</small>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
// Square/rectangle/ellipse shapes use polar coordinate functions: r(θ) = 1 / max(|cosθ|·a, |sinθ|·b)
const SHAPES = [
  { name: 'Circle',    shape: 'circle' },
  { name: 'Square',    shape: (t) => 1 / Math.max(Math.abs(Math.cos(t)), Math.abs(Math.sin(t))) },
  { name: 'Rectangle', shape: (t) => 1 / Math.max(Math.abs(Math.cos(t)), Math.abs(Math.sin(t)) * 1.8) },
  { name: 'Ellipse',   shape: (t) => 1 / Math.sqrt(Math.pow(Math.cos(t) / 1.6, 2) + Math.pow(Math.sin(t), 2)) },
];
const SHAPE_MS = 20_000;
const POLL_EMPTY_MS = 10_000;
const POLL_LIVE_MS  = 5 * 60_000;

// Colour palette – lower index = higher frequency
const PALETTE = [
  '#60a5fa','#22d3ee','#4ade80','#a78bfa',
  '#f472b6','#fb923c','#fbbf24','#f87171',
  '#38bdf8','#86efac','#c084fc','#fdba74',
];

// ── State ─────────────────────────────────────────────────────────────────────
let allTopics = [];
let shapeIdx  = 0;
let shapeCycleTimer = null;
let pollTimer       = null;
let modal           = null;
let lastRefreshAt   = null;
let lastRefreshTimer = null;
let buildTimestamp  = null;
let drawnTopicCount = 0;

// ── Boot ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  modal = new bootstrap.Modal(document.getElementById('articlesModal'));
  buildDots();
  fetchStatus();
  fetchTopics();
  startShapeCycle();
  lastRefreshTimer = setInterval(renderLastRefreshed, 30_000);
});

async function fetchStatus() {
  try {
    const res = await fetch('/api/status');
    if (!res.ok) return;
    const status = await res.json();
    buildTimestamp = status.buildTimestamp || null;
    renderLastRefreshed();
  } catch (e) { /* non-fatal */ }
}

// ── Data ──────────────────────────────────────────────────────────────────────
async function fetchTopics() {
  try {
    const res = await fetch('/api/trending');
    if (!res.ok) throw new Error(res.status);
    const topics = await res.json();

    allTopics = topics;
    hideOverlay();

    if (topics.length > 0) {
      // Status badge + topic count are updated when wordcloud2.js finishes
      // drawing (see onStop in renderCloud) so they reflect words actually
      // painted, not just the candidate pool.
      renderCloud(shapeIdx);
      lastRefreshAt = Date.now();
      renderLastRefreshed();
      schedulePoll(POLL_LIVE_MS);
    } else {
      showPlaceholder();
      setStatus('Gathering news…', '');
      schedulePoll(POLL_EMPTY_MS);
    }
  } catch (e) {
    hideOverlay();
    setStatus('Fetch error — retrying', 'error');
    schedulePoll(POLL_EMPTY_MS);
  }
}

function schedulePoll(ms) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(fetchTopics, ms);
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function renderCloud(sIdx) {
  if (!allTopics.length) return;

  const canvas = document.getElementById('cloud-canvas');
  const { w, h } = canvasSize();
  canvas.width  = w;
  canvas.height = h;

  const maxFreq = allTopics[0].frequency;
  const minFreq = allTopics[allTopics.length - 1].frequency;
  const freqRange = Math.max(maxFreq - minFreq, 1);
  const mobile  = w < 520;

  const wordList = allTopics.map(t => {
    const ratio  = (t.frequency - minFreq) / freqRange;
    const minSz  = mobile ? 11 : 13;
    const maxSz  = mobile ? 46 : 72;
    const size   = Math.round(minSz + ratio * (maxSz - minSz));
    return [t.phrase, size];
  });

  let attemptDrawn = 0;
  const onDrawn = (ev) => {
    // wordcloud2.js fires this for each placement attempt; detail.drawn is
    // true when the word was actually painted (it fits and is in-bound).
    if (ev && ev.detail && ev.detail.drawn) attemptDrawn++;
  };
  const onStop = () => {
    canvas.removeEventListener('wordclouddrawn', onDrawn);
    canvas.removeEventListener('wordcloudstop', onStop);
    drawnTopicCount = attemptDrawn;
    setStatus(`${drawnTopicCount} trending topics`, 'live');
    renderLastRefreshed();
  };
  canvas.addEventListener('wordclouddrawn', onDrawn);
  canvas.addEventListener('wordcloudstop', onStop);

  WordCloud(canvas, {
    list:          wordList,
    gridSize:      mobile ? 9 : 11,
    weightFactor:  1,
    fontFamily:    '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
    fontWeight:    '600',
    color: (word) => {
      const idx = allTopics.findIndex(t => t.phrase === word);
      const ratio = idx / Math.max(allTopics.length - 1, 1);
      const paletteIdx = Math.min(Math.floor(ratio * PALETTE.length), PALETTE.length - 1);
      return PALETTE[paletteIdx];
    },
    rotateRatio:   0.25,
    rotationSteps: 2,
    backgroundColor: 'transparent',
    shape:         SHAPES[sIdx].shape,
    shrinkToFit:   true,
    drawOutOfBound: false,
    click:         handleWordClick,
    hover: (item) => {
      canvas.style.cursor = item ? 'pointer' : 'default';
    },
  });

  canvas.style.display = 'block';
  hidePlaceholder();
}

function canvasSize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const mobile = vw < 768;
  const maxW = Math.max(vw - (mobile ? 16 : 40), 280);
  const maxH = Math.max(vh - 160, 280);

  if (mobile) {
    const side = Math.min(maxW, maxH, 480);
    return { w: side, h: side };
  }
  return { w: Math.min(maxW, 960), h: Math.min(maxH, 620) };
}

// ── Shape cycle ───────────────────────────────────────────────────────────────
function startShapeCycle() {
  clearInterval(shapeCycleTimer);
  shapeCycleTimer = setInterval(nextShape, SHAPE_MS);
}

function nextShape() {
  shapeIdx = (shapeIdx + 1) % SHAPES.length;
  updateHUD();
  if (allTopics.length > 0) fadeAndRender(shapeIdx);
}

function jumpToShape(idx) {
  shapeIdx = idx;
  updateHUD();
  restartTimer();
  clearInterval(shapeCycleTimer);
  startShapeCycle();
  if (allTopics.length > 0) fadeAndRender(shapeIdx);
}

function fadeAndRender(sIdx) {
  const canvas = document.getElementById('cloud-canvas');
  canvas.classList.add('fading');
  setTimeout(() => {
    renderCloud(sIdx);
    canvas.classList.remove('fading');
  }, 430);
}

function updateHUD() {
  document.getElementById('shape-name').textContent = SHAPES[shapeIdx].name;
  document.querySelectorAll('.sdot').forEach((d, i) => {
    d.classList.toggle('active', i === shapeIdx);
  });
  restartTimer();
}

function restartTimer() {
  const fill = document.getElementById('timer-fill');
  fill.style.animation = 'none';
  // Trigger reflow
  void fill.offsetWidth;
  fill.style.animation = 'timerCountdown 20s linear forwards';
}

function buildDots() {
  const wrap = document.getElementById('shape-dots');
  SHAPES.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'sdot' + (i === 0 ? ' active' : '');
    d.title = s.name;
    d.addEventListener('click', () => jumpToShape(i));
    wrap.appendChild(d);
  });
}

// ── Click handler ─────────────────────────────────────────────────────────────
function handleWordClick(item) {
  if (!item) return;
  const word  = item[0];
  const topic = allTopics.find(t => t.phrase === word);
  if (!topic) return;
  showArticlesModal(topic);
}

function showArticlesModal(topic) {
  document.getElementById('modal-title').innerHTML =
    `<span class="topic-tag">${esc(topic.phrase)}</span>`;
  document.getElementById('modal-count').textContent =
    `Found in ${topic.frequency} article${topic.frequency !== 1 ? 's' : ''} across ${countSources(topic.articles)} source${countSources(topic.articles) !== 1 ? 's' : ''}`;

  document.getElementById('modal-body').innerHTML =
    topic.articles.map(a => `
      <a class="article-card" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
        <div class="ac-source">
          <span>${esc(a.source)}</span>
          <span class="ac-date">${timeAgo(a.publishedAt)}</span>
        </div>
        <div class="ac-title">
          <span class="ac-arrow">↗</span>${esc(a.title)}
        </div>
        ${a.description ? `<div class="ac-desc">${esc(a.description)}</div>` : ''}
      </a>
    `).join('');

  modal.show();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function countSources(articles) {
  return new Set(articles.map(a => a.source)).size;
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function timeAgo(iso) {
  if (!iso) return '';
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < 0) return 'just now';
  if (ms < 60_000)      return 'just now';
  if (ms < 3_600_000)   return `${Math.floor(ms / 60_000)}m ago`;
  if (ms < 86_400_000)  return `${Math.floor(ms / 3_600_000)}h ago`;
  if (ms < 604_800_000) return `${Math.floor(ms / 86_400_000)}d ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function renderLastRefreshed() {
  const el = document.getElementById('last-refreshed');
  if (!el) return;
  if (lastRefreshAt == null) {
    el.classList.add('hidden');
    return;
  }
  el.classList.remove('hidden');
  const parts = [`Last refreshed: ${refreshedAgo(lastRefreshAt)}`];
  if (drawnTopicCount > 0) {
    parts.push(`${drawnTopicCount} topics`);
  }
  if (buildTimestamp) {
    parts.push(`built ${formatBuildTimestamp(buildTimestamp)}`);
  }
  el.textContent = parts.join(' · ');
}

function formatBuildTimestamp(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  // "May 23 9:50 PM" — drops year (current is obvious) and the "at" filler.
  const datePart = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const timePart = d.toLocaleTimeString(undefined, {
    hour: 'numeric', minute: '2-digit', hour12: true
  });
  return `${datePart} ${timePart}`;
}

function refreshedAgo(ts) {
  const ms = Date.now() - ts;
  if (ms < 60_000)     return 'just now';
  if (ms < 3_600_000)  return `${Math.floor(ms / 60_000)}m ago`;
  if (ms < 86_400_000) return `${Math.floor(ms / 3_600_000)}h ago`;
  return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function setStatus(msg, cls) {
  const el = document.getElementById('status-badge');
  el.textContent = msg;
  el.className = cls ? `${cls}` : '';
  el.id = 'status-badge';
}

function hideOverlay() {
  const ov = document.getElementById('overlay');
  ov.classList.add('hidden');
  setTimeout(() => ov.remove(), 550);
}

function showPlaceholder() {
  document.getElementById('cloud-placeholder').style.display = 'flex';
  document.getElementById('cloud-canvas').style.display = 'none';
}

function hidePlaceholder() {
  document.getElementById('cloud-placeholder').style.display = 'none';
}

// ── Resize ────────────────────────────────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (allTopics.length > 0) renderCloud(shapeIdx);
  }, 250);
});
</script>
</body>
</html>
