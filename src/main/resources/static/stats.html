<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090f">
  <title>Pipeline Stats — NewsCloud</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #08090f; --surface: #0f1322; --surface2: #161d35;
      --border: #1e2847; --text: #e2e8f0; --muted: #64748b;
      --c1: #60a5fa; --c2: #4ade80; --c5: #a78bfa; --c8: #f87171;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    #app-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .logo {
      font-size: clamp(1rem, 4vw, 1.4rem); font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; text-decoration: none;
    }
    .header-links { display: flex; gap: 8px; }
    .header-link {
      font-size: 0.78rem; color: var(--c1); text-decoration: none;
      padding: 4px 10px; border-radius: 20px;
      border: 1px solid rgba(96,165,250,.25);
      background: rgba(96,165,250,.06);
    }
    .header-link:hover { background: rgba(96,165,250,.18); color: var(--c1); }

    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }

    .card-grid {
      display: grid; gap: 12px; margin-bottom: 24px;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
    }
    .stat-label {
      font-size: .68rem; color: var(--muted); letter-spacing: .08em;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .stat-value {
      font-size: 1.6rem; font-weight: 700; color: var(--c1);
      font-variant-numeric: tabular-nums;
    }

    .section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px 20px; margin-bottom: 18px;
    }
    .section-title {
      font-size: .95rem; font-weight: 600; margin-bottom: 14px;
      color: var(--text);
    }

    .pipeline-row {
      display: grid; grid-template-columns: 1fr auto auto;
      align-items: center; gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .pipeline-row:last-child { border-bottom: none; }
    .stage-name { font-size: .88rem; }
    .stage-count {
      font-variant-numeric: tabular-nums; font-weight: 600;
      color: var(--text); min-width: 60px; text-align: right;
    }
    .stage-delta {
      font-size: .72rem; color: var(--muted);
      min-width: 80px; text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .stage-delta.drop { color: var(--c8); }

    .bar-row {
      display: grid; grid-template-columns: 1fr auto;
      align-items: center; gap: 10px; padding: 6px 0;
    }
    .bar-label { font-size: .82rem; }
    .bar-track {
      grid-column: 1 / -1;
      height: 6px; background: var(--border); border-radius: 3px;
      overflow: hidden; margin-top: 2px;
    }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--c1), var(--c5)); border-radius: 3px; }
    .bar-count {
      font-size: .78rem; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .dropped-list {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .dropped-pill {
      font-size: .75rem; background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 3px 9px;
    }

    .empty { color: var(--muted); font-size: .85rem; padding: 8px 0; }

    @media (max-width: 576px) {
      main { padding: 16px 12px 32px; }
      .header-link { font-size: .72rem; padding: 3px 8px; }
    }
  </style>
</head>
<body>

<header id="app-header">
  <a class="logo" href="/">⚡ NewsCloud</a>
  <div class="header-links">
    <a href="/" class="header-link">Cloud</a>
    <a href="/topics.html" class="header-link">Topics</a>
    <a href="/settings.html" class="header-link">Settings</a>
  </div>
</header>

<main>
  <h1>Pipeline statistics</h1>
  <p class="sub" id="page-sub">Loading…</p>

  <div class="card-grid" id="cards"></div>

  <div class="section">
    <div class="section-title">Filtering funnel — phrases surviving each stage</div>
    <div id="funnel"></div>
  </div>

  <div class="section">
    <div class="section-title">Articles per source (in-window)</div>
    <div id="sources"></div>
  </div>

  <div class="section">
    <div class="section-title">
      Dropped at the multi-source gate
      <span style="font-weight:400;color:var(--muted);font-size:.78rem">— topics only one outlet talked about</span>
    </div>
    <div id="dropped"></div>
  </div>
</main>

<script>
async function load() {
  try {
    const res = await fetch('/api/stats');
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
  } catch (e) {
    document.getElementById('page-sub').textContent = 'Failed to load stats.';
  }
}

function render(s) {
  const sub = document.getElementById('page-sub');
  if (!s.computedAt) {
    sub.textContent = 'Pipeline has not run yet. Give it a moment.';
    return;
  }
  const when = new Date(s.computedAt);
  sub.textContent = `Last compute ${when.toLocaleString()} — refresh this page after the next 15-min recompute to see updated numbers.`;

  const cards = [
    ['Total articles',    s.totalArticles ?? 0],
    ['In window',         s.articlesInWindow ?? 0],
    ['Proper nouns',      s.properNounCount ?? 0],
    ['Final topics',      s.finalTopics ?? 0],
  ];
  document.getElementById('cards').innerHTML = cards.map(([k,v]) => `
    <div class="stat-card">
      <div class="stat-label">${k}</div>
      <div class="stat-value">${v.toLocaleString()}</div>
    </div>
  `).join('');

  const stages = [
    ['Raw phrases (n-gram extraction)', s.rawPhrases],
    ['After frequency / IDF gates',     s.afterFrequencyGates],
    ['After subphrase absorb',          s.afterAbsorb],
    ['After word-overlap merge',        s.afterMerge],
    ['After proper-noun dedup',         s.afterProperNounDedup],
    ['After multi-source filter',       s.afterMultiSource],
    ['Final topics (after limit)',      s.finalTopics],
  ];
  let prev = null;
  document.getElementById('funnel').innerHTML = stages.map(([name, count]) => {
    let delta = '';
    if (prev != null && count != null) {
      const d = count - prev;
      if (d !== 0) delta = `<span class="stage-delta ${d < 0 ? 'drop' : ''}">${d > 0 ? '+' : ''}${d}</span>`;
      else delta = '<span class="stage-delta">±0</span>';
    } else {
      delta = '<span class="stage-delta"></span>';
    }
    prev = count;
    return `
      <div class="pipeline-row">
        <div class="stage-name">${name}</div>
        <div class="stage-count">${(count ?? 0).toLocaleString()}</div>
        ${delta}
      </div>
    `;
  }).join('');

  const bySource = s.articlesBySource || {};
  const entries = Object.entries(bySource).sort((a,b) => b[1] - a[1]);
  const max = entries[0]?.[1] || 1;
  const sourcesEl = document.getElementById('sources');
  sourcesEl.innerHTML = entries.length ? entries.map(([src, n]) => `
    <div class="bar-row">
      <div class="bar-label">${esc(src)}</div>
      <div class="bar-count">${n}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(n / max * 100).toFixed(1)}%"></div></div>
    </div>
  `).join('') : '<div class="empty">No articles yet.</div>';

  const dropped = s.droppedSingleSource || [];
  document.getElementById('dropped').innerHTML = dropped.length
    ? `<div class="dropped-list">${dropped.map(d => `<span class="dropped-pill">${esc(d)}</span>`).join('')}</div>`
    : '<div class="empty">Nothing dropped at the multi-source gate this run.</div>';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
