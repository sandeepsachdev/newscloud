<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090f">
  <title>All Trending Topics — NewsCloud</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #08090f; --surface: #0f1322; --surface2: #161d35;
      --border: #1e2847; --text: #e2e8f0; --muted: #64748b;
      --c1: #60a5fa; --c2: #4ade80; --c8: #f87171;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    #app-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .logo {
      font-size: clamp(1rem, 4vw, 1.4rem);
      font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }
    .header-link {
      font-size: 0.78rem; color: var(--c1); text-decoration: none;
      padding: 4px 10px; border-radius: 20px;
      border: 1px solid rgba(96,165,250,.25);
      background: rgba(96,165,250,.06);
      transition: background .2s;
    }
    .header-link:hover { background: rgba(96,165,250,.18); color: var(--c1); }

    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }

    .page-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .page-sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }

    #empty-state {
      text-align: center; color: var(--muted);
      padding: 60px 20px; border: 1px dashed var(--border);
      border-radius: 16px;
    }

    #topics-list {
      display: grid; gap: 10px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }
    .topic-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      cursor: pointer;
      transition: border-color .2s, transform .15s, background .2s;
      text-align: left; width: 100%;
      color: var(--text); font: inherit;
    }
    .topic-row:hover, .topic-row:focus {
      border-color: var(--c1); transform: translateY(-1px);
      background: var(--surface2); outline: none;
    }
    .topic-main {
      display: flex; flex-direction: column; gap: 3px; min-width: 0;
    }
    .topic-rank {
      font-size: 0.65rem; color: var(--muted); letter-spacing: .08em;
      text-transform: uppercase;
    }
    .topic-phrase {
      font-size: 0.95rem; font-weight: 600; line-height: 1.3;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .topic-stats {
      display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
      flex-shrink: 0;
    }
    .topic-freq {
      font-size: 1rem; font-weight: 700; color: var(--c1);
      font-variant-numeric: tabular-nums;
    }
    .topic-sources {
      font-size: 0.68rem; color: var(--muted);
    }

    /* Modal — same look as the main page */
    .modal-content {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text);
    }
    .modal-header { border-bottom: 1px solid var(--border); padding: 16px 20px; }
    .modal-title { font-size: 1rem; font-weight: 600; }
    .modal-footer { border-top: 1px solid var(--border); padding: 12px 20px; }
    .modal-body { padding: 16px; max-height: 65vh; overflow-y: auto; }
    .modal-body::-webkit-scrollbar { width: 5px; }
    .modal-body::-webkit-scrollbar-track { background: transparent; }
    .modal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    .article-card {
      display: block; text-decoration: none;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 15px; margin-bottom: 10px;
      transition: border-color .2s, transform .15s; color: var(--text);
    }
    .article-card:hover, .article-card:focus {
      border-color: var(--c1); transform: translateY(-1px); color: var(--text);
    }
    .article-card:last-child { margin-bottom: 0; }
    .ac-source {
      font-size: .68rem; font-weight: 600; letter-spacing: .07em;
      text-transform: uppercase; color: var(--c1); margin-bottom: 5px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .ac-date { font-size: .68rem; color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
    .ac-title { font-size: .88rem; font-weight: 500; line-height: 1.45; margin-bottom: 5px; }
    .ac-desc {
      font-size: .78rem; color: var(--muted); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .ac-arrow { float: right; color: var(--c1); font-size: .8rem; margin-left: 6px; margin-top: 2px; }

    .topic-tag {
      display: inline-block; background: rgba(96,165,250,.15);
      color: var(--c1); border: 1px solid rgba(96,165,250,.3);
      border-radius: 6px; padding: 2px 9px; font-size: .78rem; font-weight: 600;
    }
    .article-count-badge { font-size: .72rem; color: var(--muted); }

    @media (max-width: 576px) {
      main { padding: 16px 12px 32px; }
      #topics-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header id="app-header">
  <a class="logo" href="/">⚡ NewsCloud</a>
  <a href="/" class="header-link">← Word cloud</a>
</header>

<main>
  <h1 class="page-title">All trending topics</h1>
  <p class="page-sub" id="page-sub">Loading…</p>

  <div id="empty-state" style="display:none">No trending topics yet — give the feeds a moment to load.</div>
  <div id="topics-list"></div>
</main>

<!-- Articles modal — same markup as index.html so behaviour matches -->
<div class="modal fade" id="articlesModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modal-title"></div>
          <div class="article-count-badge mt-1" id="modal-count"></div>
        </div>
        <button type="button" class="btn-close btn-close-white ms-3" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer justify-content-start py-2">
        <small class="text-muted">Click any article to open in a new tab</small>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let modal = null;
let allTopics = [];

document.addEventListener('DOMContentLoaded', () => {
  modal = new bootstrap.Modal(document.getElementById('articlesModal'));
  fetchTopics();
  // Refresh every few minutes so the list stays in step with the cloud.
  setInterval(fetchTopics, 5 * 60_000);
});

async function fetchTopics() {
  try {
    const res = await fetch('/api/trending');
    if (!res.ok) throw new Error(res.status);
    allTopics = await res.json();
    render();
  } catch (e) {
    document.getElementById('page-sub').textContent = 'Failed to load topics — retrying shortly.';
  }
}

function render() {
  const list = document.getElementById('topics-list');
  const empty = document.getElementById('empty-state');
  const sub = document.getElementById('page-sub');

  if (!allTopics.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    sub.textContent = '';
    return;
  }
  empty.style.display = 'none';
  sub.textContent = `${allTopics.length} topic${allTopics.length === 1 ? '' : 's'} — click any to see the articles behind it`;

  list.innerHTML = allTopics.map((t, i) => {
    const sources = countSources(t.articles);
    return `
      <button class="topic-row" data-idx="${i}">
        <div class="topic-main">
          <div class="topic-rank">#${i + 1}</div>
          <div class="topic-phrase" title="${esc(t.phrase)}">${esc(t.phrase)}</div>
        </div>
        <div class="topic-stats">
          <div class="topic-freq">${t.frequency}</div>
          <div class="topic-sources">${sources} source${sources === 1 ? '' : 's'}</div>
        </div>
      </button>
    `;
  }).join('');

  list.querySelectorAll('.topic-row').forEach(row => {
    row.addEventListener('click', () => {
      const idx = parseInt(row.dataset.idx, 10);
      const topic = allTopics[idx];
      if (topic) showArticlesModal(topic);
    });
  });
}

function showArticlesModal(topic) {
  const sources = countSources(topic.articles);
  document.getElementById('modal-title').innerHTML =
    `<span class="topic-tag">${esc(topic.phrase)}</span>`;
  document.getElementById('modal-count').textContent =
    `Found in ${topic.frequency} article${topic.frequency !== 1 ? 's' : ''} across ${sources} source${sources !== 1 ? 's' : ''}`;

  document.getElementById('modal-body').innerHTML =
    topic.articles.map(a => `
      <a class="article-card" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
        <div class="ac-source">
          <span>${esc(a.source)}</span>
          <span class="ac-date">${timeAgo(a.publishedAt)}</span>
        </div>
        <div class="ac-title">
          <span class="ac-arrow">↗</span>${esc(a.title)}
        </div>
        ${a.description ? `<div class="ac-desc">${esc(a.description)}</div>` : ''}
      </a>
    `).join('');

  modal.show();
}

function countSources(articles) {
  return new Set(articles.map(a => a.source)).size;
}

function timeAgo(iso) {
  if (!iso) return '';
  const ms = Date.now() - new Date(iso).getTime();
  if (isNaN(ms) || ms < 0) return '';
  if (ms < 60_000)     return 'just now';
  if (ms < 3_600_000)  return `${Math.floor(ms / 60_000)}m ago`;
  if (ms < 86_400_000) return `${Math.floor(ms / 3_600_000)}h ago`;
  if (ms < 604_800_000) return `${Math.floor(ms / 86_400_000)}d ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
</script>
</body>
</html>
